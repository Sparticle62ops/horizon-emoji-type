[package]
name = "horizon-mod-emoji-type"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Type `:shortcode:` in chat and the sent message carries its emoji: an exact 1:1 Rust port of Emoji Type."

[lib]
path = "src/lib.rs"

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
